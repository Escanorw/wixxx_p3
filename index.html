<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WIXX P3 — Mobilité internationale</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/index.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <div class="monogram">P3</div>
    <div class="title">
      <h1>Mobilité internationale</h1>
      <p>Découvrez où les P3 sont partis cette année. Cliquez sur un point pour lire leur histoire.</p>
    </div>
  </div>
  <div class="header-actions">
    <div id="stats">Chargement…</div>
    <button id="toggleViewBtn" class="toggle-btn" type="button" aria-pressed="false">Voir la liste</button>
  </div>
</header>
<div id="map"></div>
<div id="list" class="list">
  <div class="list-bar">
    <div class="list-bar-inner">
      <label class="list-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input id="listSearch" type="search" placeholder="Nom, bucque, ville…" autocomplete="off" spellcheck="false" aria-label="Rechercher un P3">
        <kbd class="list-search-kbd" aria-hidden="true">/</kbd>
      </label>
      <p id="listCount" class="list-count" aria-live="polite"></p>
    </div>
  </div>
  <div id="listBody" class="list-body"></div>
</div>
<div id="status">Chargement…</div>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()" aria-label="Fermer">&times;</button>
  <img id="lightbox-img" alt="" onclick="event.stopPropagation()">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="app.js"></script>
</body>
</html>
